<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="305" viewBox="0 0 1100 305" role="img" aria-labelledby="title description">
  <title id="title">Automatic differentiation example</title>
  <desc id="description">Input tensor x equals 2, forward calculation y equals x squared equals 4, backward calculation dy divided by dx equals 2x equals 4, final output is the one-element array 4.</desc>
  <rect width="1100" height="305" rx="18" fill="#F3F7FC"/>
  <text x="35" y="47" fill="#183154" font-family="Arial,sans-serif" font-size="24" font-weight="700">AUTOGRAD / REPRODUCIBLE NUMERICAL EXAMPLE</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <rect x="35" y="92" width="235" height="143" rx="13" fill="#E3EDF8" stroke="#8AB0D3" stroke-width="2"/>
    <rect x="315" y="92" width="235" height="143" rx="13" fill="#E3EDF8" stroke="#8AB0D3" stroke-width="2"/>
    <rect x="595" y="92" width="235" height="143" rx="13" fill="#D8EAF9" stroke="#377CB7" stroke-width="2"/>
    <rect x="875" y="92" width="190" height="143" rx="13" fill="#D9F5E8" stroke="#3AA987" stroke-width="2"/>
    <text x="152" y="126" fill="#28517C" font-size="15" font-weight="700">INPUT</text>
    <text x="152" y="176" fill="#0D2645" font-size="30" font-weight="700">x = 2</text>
    <text x="432" y="126" fill="#28517C" font-size="15" font-weight="700">FORWARD</text>
    <text x="432" y="176" fill="#0D2645" font-size="27" font-weight="700">y = x² = 4</text>
    <text x="712" y="126" fill="#28517C" font-size="15" font-weight="700">BACKWARD</text>
    <text x="712" y="176" fill="#0D2645" font-size="25" font-weight="700">dy/dx = 2x</text>
    <text x="970" y="126" fill="#187A5D" font-size="15" font-weight="700">OUTPUT</text>
    <text x="970" y="176" fill="#0B513F" font-size="32" font-weight="700">[4.]</text>
  </g>
  <path d="M277 163 H307 M296 155 L307 163 L296 171 M557 163 H587 M576 155 L587 163 L576 171 M837 163 H867 M856 155 L867 163 L856 171" stroke="#3479B5" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="35" y="274" fill="#4B6280" font-family="Arial,sans-serif" font-size="15">Verified on CPU · The brackets indicate a one-element tensor · This is a gradient check, not a full model-quality benchmark</text>
</svg>
