name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# The CPU test suite must pass without CUDA, without a GPU and without any
# repository secret. Nothing in this workflow needs credentials.
permissions:
  contents: read

# CI runners do not provide an interactive desktop. Force Matplotlib's
# non-interactive backend so chart tests exercise rendering and file output
# without depending on Tk/Tcl packages supplied by a runner image.
env:
  MPLBACKEND: Agg
  # everyo.distributed runs one process per worker. Without this, NumPy's BLAS
  # starts a thread pool inside each of them and they contend over the runner's
  # two cores -- which makes the distributed tests slow rather than parallel.
  OMP_NUM_THREADS: "1"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install EveryO with development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show environment
        run: python -m everyo info

      - name: Check the installation
        run: python -m everyo doctor

      - name: Compile every module
        run: python -m compileall -q everyo

      - name: Run the test suite
        run: python -m pytest -q

      # Every docstring example is executable. Running them keeps the
      # documentation from drifting away from the code it describes. Both ONNX
      # exporters' examples need the optional 'onnx' package, so they run in
      # the dedicated ONNX job below rather than being weakened to +SKIP here.
      - name: Run the docstring examples
        run: >-
          python -m pytest --doctest-modules everyo -q
          --ignore=everyo/serialization/onnx_export.py
          --ignore=everyo/serialization/onnx_trace.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  tensorflow:
    name: TensorFlow backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the TensorFlow extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,tensorflow]"
      - name: Run the TensorFlow integration tests
        run: python -m pytest tests/test_tensorflow_backend.py -q

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run the CPU examples
        env:
          MPLBACKEND: Agg
        run: |
          python examples/tensor_basics.py
          python examples/linear_regression.py
          python examples/binary_classification.py
          python examples/save_and_load.py
          python examples/mixed_precision.py
          python examples/distributed_training.py
          python examples/cuda_example.py

  onnx:
    name: ONNX export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with the ONNX extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,onnx]"
      - name: Round-trip every supported layer through ONNX Runtime
        run: python -m pytest tests/test_onnx.py -q
      # The tracing exporter is the only way recurrent and attention models
      # reach ONNX, and every test in here re-runs the exported graph through
      # ONNX Runtime rather than trusting the schema checker.
      - name: Round-trip recurrent and attention models through ONNX Runtime
        run: python -m pytest tests/test_onnx_trace.py -q
      - name: Run both exporters' docstring examples
        run: >-
          python -m pytest --doctest-modules -q
          everyo/serialization/onnx_export.py
          everyo/serialization/onnx_trace.py
      - name: Run the export examples
        run: |
          python examples/onnx_export.py
          python examples/onnx_trace.py

  build:
    name: Package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - name: Build the distribution
        run: python -m build
      - name: Check the metadata
        run: python -m twine check dist/*
