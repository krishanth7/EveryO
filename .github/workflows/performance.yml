name: Performance & Reliability Qualification

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly qualification run every Monday at 06:00 UTC (runs intentional 10-minute soak)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      qualification_profile:
        description: 'Soak qualification profile to execute'
        required: true
        default: 'smoke_10s'
        type: choice
        options:
          - 'smoke_10s'
          - 'short_10m'
          - 'medium_30m'
          - 'extended_2h'
          - 'endurance_8h'

permissions:
  contents: read

# Fast push/PR runs cancel prior stale runs on the same branch.
# Manual workflow_dispatch and scheduled runs are isolated by run_id with cancel-in-progress disabled to prevent accidental cancellation.
concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

jobs:
  performance-qualification:
    name: CPU Performance, Stress, Soak & Regression Gates
    runs-on: ubuntu-latest
    timeout-minutes: 540
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install EveryO with development dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Phase 21 performance qualification test suite
        timeout-minutes: 15
        run: python -m pytest tests/test_phase21_performance_baseline.py tests/test_phase21_memory_profiling.py tests/test_phase21_concurrency.py tests/test_phase21_stress.py tests/test_phase21_soak.py tests/test_phase21_fault_injection.py tests/test_phase21_recovery.py tests/test_phase21_regression_gates.py -v

      - name: Run CPU benchmark and evaluate regression gates
        timeout-minutes: 5
        run: python -m everyo.benchmarking --profile quick --compare-baseline --output benchmark-results.json

      - name: Run concurrency and stress qualification
        timeout-minutes: 5
        run: python -m everyo.benchmarking --profile concurrency

      # Fast PR / Push CI: 10-second smoke stability check (smoke check only; does not claim long-duration qualification)
      - name: Run short soak smoke stability check (10s)
        if: (github.event_name != 'workflow_dispatch' && github.event_name != 'schedule') || (github.event_name == 'workflow_dispatch' && github.event.inputs.qualification_profile == 'smoke_10s')
        timeout-minutes: 5
        run: python -m everyo.benchmarking --profile soak --duration 10

      # Scheduled weekly qualification: intentional 10-minute soak qualification
      - name: Run scheduled weekly 10-minute soak qualification
        if: github.event_name == 'schedule'
        timeout-minutes: 20
        run: python -m everyo.benchmarking --profile soak --duration 600 --trace-python --output benchmarks/reports/soak_10min_telemetry.json

      # Manual workflow_dispatch soak profiles (explicitly selected duration with trace-python enabled)
      - name: Run 10-minute soak stability qualification
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.qualification_profile == 'short_10m'
        timeout-minutes: 20
        run: python -m everyo.benchmarking --profile soak --duration 600 --trace-python --output benchmarks/reports/soak_10min_telemetry.json

      - name: Run 30-minute soak stability qualification
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.qualification_profile == 'medium_30m'
        timeout-minutes: 45
        run: python -m everyo.benchmarking --profile soak --duration 1800 --trace-python --output benchmarks/reports/soak_30min_telemetry.json

      - name: Run 2-hour soak stability qualification
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.qualification_profile == 'extended_2h'
        timeout-minutes: 150
        run: python -m everyo.benchmarking --profile soak --duration 7200 --trace-python --output benchmarks/reports/soak_2hr_telemetry.json

      - name: Run 8-hour endurance soak qualification
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.qualification_profile == 'endurance_8h'
        timeout-minutes: 520
        run: python -m everyo.benchmarking --profile soak --duration 28800 --trace-python --output benchmarks/reports/soak_8hr_telemetry.json

      - name: Run fault-recovery qualification
        timeout-minutes: 5
        run: python -m everyo.benchmarking --profile fault-recovery

      - name: Upload benchmark qualification artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: everyo-performance-${{ github.event_name }}-${{ github.sha }}
          path: |
            benchmark-results.json
            benchmarks/reports/*.json
          retention-days: 90
