name: Security & Supply Chain Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency Audit & SBOM Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,signing]"

      - name: Generate CycloneDX SBOM
        run: python scripts/generate_sbom.py --format cyclonedx --output cyclonedx-sbom.json

      - name: Generate SPDX SBOM
        run: python scripts/generate_sbom.py --format spdx --output spdx-sbom.json

      - name: Run security qualification test suite
        run: python -m pytest tests/test_production_security_qualification.py -q
