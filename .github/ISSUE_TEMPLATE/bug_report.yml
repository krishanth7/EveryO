name: Bug report
description: Something in EveryO behaves incorrectly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please do not include
        credentials, tokens or private data — EveryO never needs any.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest script that shows the problem.
      render: python
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste the output of `everyo info`.
      render: text
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback
      description: The full traceback, if there was one.
      render: text
