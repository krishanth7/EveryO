# Production-hardened Nginx reverse proxy configuration for EveryO model serving.
# Provides TLS 1.2/1.3 termination, rate limiting, request buffer limits, and security headers.

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format - exclude authorization headers, request bodies, and tokens
    log_format production_json escape=json
        '{"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    # TCP performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    types_hash_max_size 2048;

    # Strict payload and buffer limits to prevent Denial-of-Service / memory exhaustion
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Rate limiting: 50 requests per second per IP, burst capacity of 20
    limit_req_zone $binary_remote_addr zone=everyo_rate_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=everyo_conn_limit:10m;

    # Upstream EveryO loopback serving instance
    upstream everyo_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Hardened HTTPS Serving
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name everyo.internal;

        # TLS configuration - modern ciphers only, no SSLv3/TLSv1.0/TLSv1.1
        ssl_certificate /etc/nginx/ssl/everyo.crt;
        ssl_certificate_key /etc/nginx/ssl/everyo.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health and liveness probe - exempt from rate limits
        location ~ ^/(health|healthz)$ {
            proxy_pass http://everyo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Readiness probe - exempt from rate limits
        location ~ ^/(ready|readyz)$ {
            proxy_pass http://everyo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # Prometheus / internal metrics - restricted to internal CIDR / monitoring agent
        location = /metrics {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://everyo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Model Inference Endpoint - rate-limited and connection-bounded
        location = /v1/predict {
            limit_req zone=everyo_rate_limit burst=20 nodelay;
            limit_conn everyo_conn_limit 10;

            proxy_pass http://everyo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # Deny all other routes
        location / {
            return 404 '{"error":"not_found"}';
        }
    }
}
